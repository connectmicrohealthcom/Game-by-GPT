<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LAST FLOOR</title>
  <meta name="description" content="A short atmospheric mystery thriller." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="The Last Floor game"></canvas>
    <div id="vignette"></div>
    <section id="hud">
      <div class="hud-left">
        <div class="brand">THE LAST FLOOR</div>
        <div id="objective">Find the emergency key.</div>
      </div>
      <div class="hud-right">
        <div class="battery"><span id="batteryFill"></span></div>
        <div id="batteryText">100%</div>
      </div>
    </section>
    <div id="prompt"></div>
    <div id="crosshair">+</div>
    <section id="message" class="hidden"></section>
    <section id="start" class="panel">
      <div class="eyebrow">NIGHT SHIFT // 03:17 AM</div>
      <h1>THE LAST<br><em>FLOOR</em></h1>
      <p>The elevator stopped at a floor that does not exist.</p>
      <button id="startBtn">ENTER THE FLOOR</button>
      <div class="controls">WASD / ARROWS &nbsp;·&nbsp; SHIFT RUN &nbsp;·&nbsp; E INTERACT</div>
    </section>
    <section id="end" class="panel hidden"></section>
  </main>
  <script src="game.js"></script>
</body>
</html>
